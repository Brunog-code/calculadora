<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- css -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center">

        <div class="row">
           <div class="col d-flex justify-content-center">
                <div class="calculadora">

                    <!-- display -->
                    <input 
                    type="text" 
                    disabled
                    class="form-control displayResultado"
                    id="displayResultado"
                    placeholder="0"
                    >

                    <!-- first row -->
                    <div class="row">
                        <button id="btnClear" class="btn btn-dark btn-lg font-weight-light clear btnClear">C</button>
                        <button class="btn btn-dark btn-lg font-weight-light btnAcao">/</button>
                        <button class="btn btn-dark btn-lg font-weight-light btnAcao">x</button>
                    </div>

                    <div class="row">
                        <button class="btn btn-dark btn-lg font-weight-light btnValor">7</button>
                        <button class="btn btn-dark btn-lg font-weight-light btnValor">8</button>
                        <button class="btn btn-dark btn-lg font-weight-light btnValor">9</button>
                        <button class="btn btn-dark btn-lg font-weight-light btnAcao">-</button>
                    </div>

                    <div class="row">
                        <button class="btn btn-dark btn-lg font-weight-light btnValor">4</button>
                        <button class="btn btn-dark btn-lg font-weight-light btnValor">5</button>
                        <button class="btn btn-dark btn-lg font-weight-light btnValor">6</button>
                        <button class="btn btn-dark btn-lg font-weight-light btnAcao">+</button>
                    </div>

                    <div class="row">
                        <button class="btn btn-dark btn-lg font-weight-light btnValor">1</button>
                        <button class="btn btn-dark btn-lg font-weight-light btnValor">2</button>
                        <button class="btn btn-dark btn-lg font-weight-light btnValor">3</button>
                        <button id="btnCalcular" data-id="=" class="btn btn-dark btn-lg font-weight-light equal">=</button>
                    </div>

                    <div class="row lastRow">
                        <button class="btn btn-dark btn-lg font-weight-light zero btnValor">0</button>
                        <button class="btn btn-dark btn-lg font-weight-light btnValor">.</button>
                    </div>

                </div><!--Fim calculadora-->
           </div> 
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
